name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (keep-alive)
        run: |
          # Strip trailing slash from URL
          SUPA_URL="${{ secrets.SUPABASE_URL }}"
          SUPA_URL="${SUPA_URL%/}"

          # Ping auth health - any HTTP response means server is running
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            "${SUPA_URL}/auth/v1/health")

          echo "Supabase health ping status: $STATUS"

          # 000 = connection failed (no server), anything else = server is alive
          if [ "$STATUS" = "000" ] || [ -z "$STATUS" ]; then
            echo "❌ Supabase is unreachable (no HTTP response)"
            exit 1
          fi

          echo "✅ Supabase is alive (HTTP $STATUS — any response means server is running)"
