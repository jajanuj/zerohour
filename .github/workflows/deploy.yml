name: Deploy to Fly.io

on:
  push:
    branches: [main, master]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check token is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "❌ FLY_API_TOKEN secret is not set!"
            exit 1
          fi
          echo "✅ FLY_API_TOKEN is set (length: ${#FLY_API_TOKEN})"

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Ensure worker is running
        # Fly.io does not auto-start non-HTTP process groups after a rolling deploy.
        # Scale to 0 then 1 to force restart any stopped/OOM-killed machine.
        run: |
          flyctl scale count worker=0 -a zerohour-trading-engine --yes
          sleep 5
          flyctl scale count worker=1 -a zerohour-trading-engine --yes
          echo "✅ worker restarted"
