name: Deploy to Fly.io

on:
  push:
    branches: [main, master]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # 測試閘門（A-diagnosis.md 痛點三，老闆 2026-07-06 核准）：
  # 單元測試不過 → 不部署。安裝步驟與 test.yml 對齊。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          TRADING_MODE: paper
        run: python -m pytest tests/unit -x -q

  deploy:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check token is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "❌ FLY_API_TOKEN secret is not set!"
            exit 1
          fi
          echo "✅ FLY_API_TOKEN is set (length: ${#FLY_API_TOKEN})"

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Ensure worker is running
        # Fly.io does not auto-start non-HTTP process groups after a rolling deploy.
        # Scale to 0 then 1 to force restart any stopped/OOM-killed machine.
        run: |
          flyctl scale count worker=0 -a zerohour-trading-engine --yes
          sleep 5
          flyctl scale count worker=1 -a zerohour-trading-engine --yes
          echo "✅ worker restarted"
