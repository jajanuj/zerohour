app = "zerohour-trading-engine"
primary_region = "nrt"

[build]
  dockerfile = "docker/Dockerfile"

[processes]
  web       = "uvicorn src.main:app --host 0.0.0.0 --port 8080"
  worker    = "celery -A src.tasks worker --loglevel=info -Q celery,signals,orders,alerts -c 2"
  scheduler = "celery -A src.tasks beat   --loglevel=info"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[env]
  TZ = "Asia/Taipei"

[[ vm ]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["web"]

[[ vm ]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]

[[ vm ]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["scheduler"]
