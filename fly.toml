# ⚠️ 已停用（2026-10-03）：Fly.io app `zerohour-trading-engine` 已刪除，
# 本檔僅保留作為部署架構參考（web/worker 行程與記憶體配置）。
# 勿執行 `fly deploy` / `fly launch`——會重新建立 app 並開始計費。
app = "zerohour-trading-engine"
primary_region = "nrt"

[build]
  dockerfile = "docker/Dockerfile"

[processes]
  web    = "uvicorn src.main:app --host 0.0.0.0 --port 8080"
  worker = "celery -A src.tasks worker --loglevel=info -Q celery,signals,orders,alerts --pool=solo -B"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[env]
  TZ = "Asia/Taipei"

[[ vm ]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["web"]

[[ vm ]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
